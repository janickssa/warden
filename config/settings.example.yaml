# Human-only settings (README 10.0 and 17.3). Claude can neither read nor change these.
server:
  public_url: https://warden.example.dk   # clients via NPM, no port
approvals:
  expiry_min: 30
  passkey_medium: false
  chat: true
  chat_max_steps: 10
http:
  # /mcp (Claude), /api and /ws (the dashboard). NPM forwards those paths of https://<public_url> here.
  # Use the guest's LAN address if NPM runs on another host, and firewall the port to NPM only.
  listen_host: 127.0.0.1
  listen_port: 8700
agents:
  # Agents connect here directly, not through NPM (mTLS needs the client certificate end to end).
  listen_host: 0.0.0.0
  listen_port: 8443
  # Every name or IP agents use to reach Warden (LAN name, IP, WireGuard address). Goes into the server cert.
  server_names: [warden.lan, 10.0.20.5]
