[project]
name = "warden"
version = "0.1.0"
description = "Plan-then-execute MCP server with gatekeepers and human approval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0.2",
    "python-ulid>=3.0",
    "cryptography>=43",
]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "PT"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
