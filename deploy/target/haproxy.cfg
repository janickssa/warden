# Docker API proxy for warden-agent: unix socket in, docker.sock out, deny by default.
global
  log stdout format raw local0
  maxconn 64

defaults
  mode http
  log global
  option httplog
  timeout connect 10s
  timeout client 30m
  timeout server 30m
  timeout tunnel 1h

frontend warden
  bind /run/warden/docker-proxy.sock mode 660 uid 0 gid "${WARDEN_GID}"
  # What `docker ps/logs/inspect/start/stop/restart` and `docker compose` need, and nothing else.
  acl allowed path_reg ^(/v[0-9.]+)?/(_ping|version|info|containers|images|networks|volumes|build|session|grpc|distribution)(/|$|\?)
  acl denied  path_reg ^(/v[0-9.]+)?/containers/[^/]+/(exec|archive|export|update|attach/ws)
  acl denied  path_reg ^(/v[0-9.]+)?/(exec|swarm|services|tasks|nodes|secrets|configs|plugins|system|auth|commit)(/|$)
  http-request deny if denied
  http-request deny unless allowed
  default_backend dockerd

backend dockerd
  server dockerd /var/run/docker.sock
